<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashStudio | Indie Game Dev</title>
    
    <!-- Иконка вкладки -->
    <link rel="icon" type="image/png" href="logo.png">
    
    <!-- Шрифты и Иконки (Font Awesome для соцсетей) -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Comfortaa:wght@700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">

    <style>
        /* --- 1. ПЕРЕМЕННЫЕ И ОСНОВА --- */
        :root {
            --bg-sunset: #140d21;
            --sunset-orange: #ff7e5f;
            --sunset-pink: #feb47b;
            --text-light: #fff5f0;
            --card-glass: rgba(36, 24, 54, 0.6);
            --border-color: rgba(255, 126, 95, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-sunset);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            background-image: linear-gradient(to bottom, #140d21 0%, #2b1432 30%, #5c243a 60%, #9e433f 100%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .section {
            padding: 100px 0;
        }

        .section-title {
            text-align: center;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-title span {
            color: var(--sunset-pink);
        }

        /* --- 2. ШАПКА САЙТА --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            backdrop-filter: blur(15px);
            background: rgba(20, 13, 33, 0.6);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .logo-block {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        /* Лого-граната без фона (предполагается png) */
        .logo-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .logo-text {
            font-family: 'Comfortaa', cursive;
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(45deg, #fff, var(--sunset-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            margin-right: 20px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--sunset-orange);
        }

        .nav-socials {
            display: flex;
            align-items: center;
            gap: 15px;
            border-left: 1px solid rgba(255,255,255,0.1);
            padding-left: 20px;
        }

        .nav-socials a {
            color: var(--text-light);
            font-size: 20px;
            text-decoration: none;
            transition: transform 0.3s, color 0.3s;
        }

        .nav-socials a:hover {
            color: var(--sunset-pink);
            transform: scale(1.15);
        }

        /* --- 3. ГЛАВНАЯ СТРАНИЦА (HERO) --- */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 80px;
        }

        .hero-content {
            max-width: 600px;
        }

        .hero h1 {
            font-size: 54px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .hero h1 span {
            background: linear-gradient(to right, var(--sunset-orange), var(--sunset-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 18px;
            line-height: 1.6;
            color: rgba(255, 245, 240, 0.8);
            margin-bottom: 35px;
        }

        .btn {
            display: inline-block;
            padding: 15px 35px;
            background: linear-gradient(45deg, var(--sunset-orange), #ff416c);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(255, 126, 95, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 126, 95, 0.7);
        }

        /* --- 4. КАТАЛОГ ИГР (СТИЛЬ МАРКЕТПЛЕЙСА) --- */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--card-glass);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s, border-color 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--sunset-orange);
        }

        /* Мета-информация (Статус и Версия) сверху */
        .product-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .status {
            color: var(--sunset-pink);
            background: rgba(254, 180, 123, 0.1);
            padding: 3px 8px;
            border-radius: 4px;
        }

        .version {
            color: rgba(255, 255, 255, 0.4);
        }

        /* Квадратная иконка игры */
        .product-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            object-fit: cover;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .product-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            text-align: center;
        }

        /* Кнопка с ценой */
        .price-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #ff416c;
            color: #fff;
            text-align: center;
            font-weight: 700;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: background 0.3s;
        }

        .price-btn:hover {
            background: var(--sunset-orange);
        }

        .release-date {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            text-align: center;
            margin-bottom: 12px;
        }

        /* Иконки магазинов (белые, без фона) */
        .store-icons {
            display: flex;
            justify-content: center;
            gap: 14px;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .store-icons i, .store-icons span {
            cursor: pointer;
            transition: color 0.3s;
        }

        .store-icons i:hover, .store-icons span:hover {
            color: #fff;
        }

        .store-txt-ico {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 18px;
        }

        /* --- 5. ЛЕНТА НОВОСТЕЙ (16:9) --- */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
        }

        @media (max-width: 500px) {
            .news-grid { grid-template-columns: 1fr; }
        }

        .news-card {
            background: var(--card-glass);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
        }

        /* Картинка строго 16:9 */
        .news-img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.2);
        }

        .news-card h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .news-card p {
            color: rgba(255,255,255,0.7);
            font-size: 15px;
            line-height: 1.5;
        }

        /* --- 6. АККОРДЕОН FAQ (АКТИВНЫЕ СТРЕЛКИ) --- */
        .faq-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .faq-item {
            background: var(--card-glass);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .faq-question {
            display: flex;

     align-items: center;
            padding: 20px;
            font-weight: 600;cursor: pointer;
            user-select: none;
            transition: background 0.3s;
            
        }
        
        .faq-question:hover {background: rgba(255,255,255,0.02);
                             }
        /* Иконка стрелочки */.faq-icon {margin-right: 15px;
                                         transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                                         color: var(--sunset-orange);
                                        
                                        }
       
        /* Скрытый по умолчанию ответ */.faq-answer 
        
        {
            
            max-height: 0;
            overflow: hidden;transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                                                     background: rgba(0, 0, 0, 0.1);
     
        }
        
        .faq-answer-content {padding: 20px;color: rgba(255,255,255,0.7);
                             line-height: 1.6;font-size: 15px;border-top: 1px solid rgba(255,255,255,0.02);
                            
                            }
        
        /* Классы для анимации через JS /.faq-item.active .faq-icon {transform: rotate(90deg);
        / Стрелка поворачивается вниз */
      
        }
        .faq-item.active .faq-answer {max-height: 300px;
                                      /* Раскрытие контейнера */
                                     
                                     }
        
        /* --- 7. ФУТЕР --- */footer {border-top: 1px solid rgba(255, 126, 95, 0.1);padding: 30px 0;text-align: center;color: rgba(255, 245, 240, 0.3);
                                      font-size: 13px;}@media (max-width: 768px) {.hero h1 { font-size: 38px; }.nav-menu { display: none; }
                                                                                
                                                                                 }
