<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashStudio | Indie Game Dev</title>
    
    <!-- Иконка вкладки (используем ваш логотип) -->
    <link rel="icon" type="image/logo-img" href="FlashIcon.jpg">
    
    <!-- Летние и стильные шрифты -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Comfortaa:wght@700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        /* --- 1. ПЛЯЖНАЯ ЗАКАДРОВАЯ ТЕМА --- */
        :root {
            --bg-sunset: #181125;        /* Ночное закатное небо */
            --sunset-orange: #ff7e5f;    /* Теплый оранжевый */
            --sunset-pink: #feb47b;      /* Нежный персиковый */
            --accent-purple: #6a11cb;    /* Фиолетовый неон */
            --text-light: #fff5f0;
            --card-glass: rgba(36, 24, 54, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-sunset);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            /* Градиент морского заката */
            background-image: linear-gradient(to bottom, #140d21 0%, #3b1b42 40%, #78354b 70%, #bd5a4b 100%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* --- 2. ШАПКА СО СКРУГЛЕННЫМ ЛОГОТИПОМ --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            backdrop-filter: blur(15px);
            background: rgba(20, 13, 33, 0.5);
            border-bottom: 1px solid rgba(255, 126, 95, 0.2);
            z-index: 100;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .logo-block {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--sunset-orange);
            box-shadow: 0 0 15px rgba(255, 126, 95, 0.5);
        }

        .logo-text {
            font-family: 'Comfortaa', cursive;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
            background: linear-gradient(45deg, #fff, var(--sunset-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 30px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s;
        }

        .nav-links a:hover {
            color: var(--sunset-orange);
            text-shadow: 0 0 10px rgba(255, 126, 95, 0.6);
        }

        /* --- 3. ГЛАВНЫЙ ЭКРАН (HERO) --- */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            padding-top: 80px;
        }

        .hero::before {
            content: '';
            position: absolute;
            bottom: 10%;
            right: 5%;
            width: 400px;
            height: 400px;
            background: linear-gradient(to top, var(--sunset-orange), #ff416c);
            filter: blur(20px);
            opacity: 0.4;
            border-radius: 50%;
            z-index: -1;
            animation: sunGlow 4s infinite alternate ease-in-out;
        }

        .hero-content {
            max-width: 650px;
            animation: fadeIn 1s ease-out;
        }

        .hero h1 {
            font-size: 58px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: var(--sunset-orange);
            background: linear-gradient(to right, var(--sunset-orange), var(--sunset-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 18px;
            line-height: 1.6;
            color: rgba(255, 245, 240, 0.8);
            margin-bottom: 35px;
        }

        .btn {
            display: inline-block;
            padding: 15px 35px;
            background: linear-gradient(45deg, var(--sunset-orange), #ff416c);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(255, 126, 95, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 126, 95, 0.7);
        }

        /* --- 4. СЕКЦИИ И КАРТОЧКИ --- */
        .section {
            padding: 100px 0;
        }

        .section-title {
            text-align: center;
            font-size: 38px;
            font-weight: 800;
            margin-bottom: 60px;
        }

        .section-title span {
            color: var(--sunset-pink);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 35px;
        }

        .game-card {
            background: var(--card-glass);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .game-card:hover {
            transform: translateY(-10px);
            border-color: var(--sunset-orange);
            box-shadow: 0 15px 35px rgba(255, 126, 95, 0.2);
        }

        .game-img {
            width: 100%;
            height: 190px;
            background: rgba(20, 13, 33, 0.6);
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
            font-weight: 600;
            border: 1px dashed rgba(255, 126, 95, 0.3);
        }

        .status-badge {
            display: inline-block;
            background: rgba(255, 126, 95, 0.15);
            color: var(--sunset-pink);
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 20px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 126, 95, 0.3);
        }

        .game-card h3 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .game-card p {
            color: rgba(255, 245, 240, 0.7);
            font-size: 15px;
            line-height: 1.5;
        }

        /* Кнопка "Читать далее" для новостей */
        .news-link {
            color: var(--sunset-orange);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: inline-block;
            margin-top: 15px;
            transition: color 0.3s;
        }

        .news-link:hover {
            color: var(--sunset-pink);
        }

        /* --- 5. ФУТЕР --- */
        footer {
            border-top: 1px solid rgba(255, 126, 95, 0.1);
            padding: 40px 0;
            text-align: center;
            color: rgba(255, 245, 240, 0.4);
            font-size: 14px;
        }

        /* --- 6. АНИМАЦИИ --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes sunGlow {
            from { transform: scale(1); filter: blur(20px); opacity: 0.4; }
            to { transform: scale(1.1); filter: blur(30px); opacity: 0.5; }
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 38px; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <!-- ШАПКА -->
    <header>
        <div class="container nav-container">
            <a href="#home" class="logo-block">
                <img src="logo.png" alt="FlashStudio" class="logo-img">
                <div class="logo-text">FLASH STUDIO</div>
            </a>
            <nav class="nav-links">
                <a href="#home">Главная</a>
                <a href="#games">Наши Игры</a>
                <a href="#news">Новости</a> <!-- ЗАМЕНЕНО ТУТ -->
            </nav>
        </div>
    </header>

    <!-- ГЛАВНЫЙ ЭКРАН -->
       <!-- ГЛАВНЫЙ ЭКРАН -->
    <section id="home" class="hero">
        <div class="container" style="display: flex; align-items: center; justify-content: space-between; gap: 40px; flex-wrap: wrap;">
            
            <!-- Левая часть: Приветствие и Текст -->
            <div class="hero-content" style="flex: 1; min-width: 300px;">
                <h1>Тёплый закат, горячие <span>игры</span></h1>
                <p>Привет! Мы — независимая инди-студия Flash Studio. Разрабатываем душевные и атмосферные игры под шум прибоя. Наша цель — подарить игрокам незабываемые эмоции и яркий визуальный стиль.</p>
                
                <!-- Блок кнопок и соцсетей -->
                <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
                    <a href="#games" class="btn">Заглянуть в каталог</a>
                    
                    <!-- Ссылки на ваши сообщества -->
                    <div style="display: flex; gap: 15px; margin-left: 10px;">
                        <!-- Телеграм -->
                        <a href="https://t.me" target="_blank" title="Telegram" style="color: var(--sunset-pink); text-decoration: none; font-size: 24px; transition: transform 0.3s;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">📱</a>
                        <!-- YouTube / VK / Discord (можете заменить эмодзи на нужные) -->
                        <a href="#" target="_blank" title="Discord" style="color: var(--sunset-pink); text-decoration: none; font-size: 24px; transition: transform 0.3s;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">💬</a>
                    </div>
                </div>
            </div>

            <!-- Правая часть: Большой интерактивный логотип -->
            <div class="hero-image-container" style="flex: 1; min-width: 300px; display: flex; justify-content: center; animation: sunGlow 4s ease-in-out infinite alternate;">
                <img src="logo.png" alt="FlashStudio Летний Арт" style="max-width: 100%; height: auto; max-height: 400px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); border: 2px solid var(--sunset-orange);">
            </div>

        </div>
    </section>
